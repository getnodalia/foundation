name: Self check

# Lints this repository's own workflows and checks that every third-party action is pinned to a
# full commit SHA, the rule the reusable workflows ask of every Nodalia repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: actionlint and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.9
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: Actions are pinned to full SHAs
        run: python3 scripts/check_pins.py .github/workflows
