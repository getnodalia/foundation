name: ast-grep

# Reusable structural lint: runs the repository's ast-grep rule tests, then scans the given paths.
on:
  workflow_call:
    inputs:
      config:
        description: "Path to the sgconfig.yml"
        type: string
        required: true
      paths:
        description: "Paths to scan (space separated)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: ast-grep scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ast-grep
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # The version comes from install-action's manifest at its pinned commit, so it only
          # changes when that pin moves.
          tool: ast-grep
      - name: Rule tests
        env:
          CONFIG: ${{ inputs.config }}
        run: ast-grep test --config "$CONFIG" --skip-snapshot-tests
      - name: Scan
        env:
          CONFIG: ${{ inputs.config }}
          PATHS: ${{ inputs.paths }}
        run: |
          # shellcheck disable=SC2086 # PATHS is a list
          ast-grep scan --config "$CONFIG" --format github -- $PATHS
