[package]
name = "nodalia-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runtime, contract, components, patterns and shell of the craft UI library, on egui"
autotests = false

[lib]
# Every test lives in the `it` integration binary, so `cargo test` builds the library once.
test = false

[lints]
workspace = true

[features]
default = []
# `shell::app`: the eframe entry point.
app = ["nodalia-ui-shell/app"]
# `nodalia_ui::testing`: the fixture and suite runner, with every crate's test helpers.
testing = [
    "nodalia-ui-contract/testing",
    "nodalia-ui-widgets/testing",
    "nodalia-ui-panels/testing",
    "nodalia-ui-canvas/testing",
    "nodalia-ui-patterns/testing",
    "nodalia-ui-shell/testing",
]
# `nodalia_ui::testing::snapshot`: stories rendered to images offscreen (desktop only).
snapshot = ["testing", "nodalia-ui-contract/snapshot"]
# Draw colour glyphs (COLR, sbix, CBDT), e.g. colour emoji.
color_fonts = ["nodalia-ui-contract/color_fonts"]
# Find installed fonts for characters the app's faces lack (desktop only).
system_fonts = ["nodalia-ui-contract/system_fonts"]
# `share`, `account`: the share dialog and the account menu (nodalia-cloud-ui).
share = ["nodalia-cloud-ui/share"]
# `cloud`: Open and Save against cloud storage (nodalia-cloud-ui).
cloud = ["share", "nodalia-cloud-ui/cloud"]

[dependencies]
nodalia-ui-contract = { workspace = true }
nodalia-ui-widgets = { workspace = true }
nodalia-ui-panels = { workspace = true }
nodalia-ui-canvas = { workspace = true }
nodalia-ui-patterns = { workspace = true }
nodalia-ui-shell = { workspace = true }
nodalia-cloud-ui = { workspace = true }

[dev-dependencies]
nodalia-ui = { path = ".", features = ["testing"] }
nodalia-behavior = { workspace = true }
nodalia-i18n = { workspace = true, features = ["collate"] }
egui = { workspace = true }
syn = { version = "2", features = ["full"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
