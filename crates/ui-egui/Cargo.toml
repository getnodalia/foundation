[package]
name = "toma-ui-egui"
description = "The Toma egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nodalia-ui = { workspace = true }
toma-time = { workspace = true }
toma-geom = { workspace = true }
toma-color = { workspace = true }
toma-frame = { workspace = true }
toma-media = { workspace = true }
toma-project = { workspace = true }
toma-tts = { workspace = true }
toma-edit = { workspace = true }
toma-render = { workspace = true }
toma-text = { workspace = true }
toma-audio-dsp = { workspace = true }
toma-engine = { workspace = true }
toma-export = { workspace = true }
toma-gpu = { workspace = true }
toma-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# Nodalia wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
toma-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
toma-platform = { workspace = true }
toma-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
