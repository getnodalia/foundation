[package]
name = "nodalia-ui-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The canvas, its tools and controls, and the full-window dialogs of the craft UI library"

[lib]
# Every test lives in the `it` integration binary.
test = false

[lints]
workspace = true

[features]
default = []
# `nodalia_ui::testing` with the canvas test helpers (`ToolFixture`, `tool_story`, `canvas_story`).
testing = ["nodalia-ui-panels/testing"]

[dependencies]
nodalia-ui-panels = { workspace = true }
nodalia-behavior = { workspace = true }
nodalia-keymap = { workspace = true, features = ["egui"] }
nodalia-theme = { workspace = true }
nodalia-ui-macros = { workspace = true }
egui = { workspace = true }
nodalia-i18n = { workspace = true, features = ["collate"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nodalia-ui-canvas = { path = ".", features = ["testing"] }
nodalia-behavior = { workspace = true }
nodalia-keymap = { workspace = true, features = ["egui"] }
nodalia-ui-test-kit = { workspace = true }
egui = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
