[package]
name = "story-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Renders a component's stories to PNG files, offscreen, linking only the crates its features name"
autotests = false

[[bin]]
name = "story-render"
path = "src/main.rs"
test = false

[lints]
workspace = true

[features]
default = []
# One feature per domain crate whose stories can be rendered: each links that crate (through the viewer's feature of
# the same name) and nothing else above the framework. `apps` links them all, like the gallery.
apps = ["nodalia-ui-gallery/apps"]
automation = ["nodalia-ui-gallery/automation"]
browse = ["nodalia-ui-gallery/browse"]
color-ui = ["nodalia-ui-gallery/color-ui"]
draw = ["nodalia-ui-gallery/draw"]
imaging = ["nodalia-ui-gallery/imaging"]
layers = ["nodalia-ui-gallery/layers"]
menu = ["nodalia-ui-gallery/menu"]
pages = ["nodalia-ui-gallery/pages"]
print = ["nodalia-ui-gallery/print"]
review = ["nodalia-ui-gallery/review"]
table = ["nodalia-ui-gallery/table"]
text = ["nodalia-ui-gallery/text"]
theme-editor = ["nodalia-ui-gallery/theme-editor"]
theme-store = ["nodalia-ui-gallery/theme-store"]
timeline = ["nodalia-ui-gallery/timeline"]
dialogs = ["nodalia-ui-gallery/dialogs"]
font-manager = ["nodalia-ui-gallery/font-manager"]
update = ["nodalia-ui-gallery/update"]

[dependencies]
# The same framework features as the gallery (the runtime's `testing` includes the snapshot renderer), so the
# framework builds once for the gallery, the tests and this bin.
nodalia-behavior = { workspace = true }
nodalia-ui = { workspace = true, features = ["app", "testing"] }
nodalia-ui-gallery = { path = "../ui-gallery", default-features = false }
egui = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
