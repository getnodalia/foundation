[package]
name = "nodalia-browse"
description = "Browsing for Craft apps: places and folder listings, linked files, file thumbnails, and (`ui`) the tile grid, media bin, places tree, compare tile and relink."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The browsing widgets (`nodalia_browse::ui`) and `FileThumbSource`.
ui = ["dep:nodalia-behavior", "dep:nodalia-ui", "dep:egui", "dep:kurbo"]
# The widgets' stories and trials (`tests/it`).
screen-testing = ["ui", "nodalia-ui/testing"]

[dependencies]
nodalia-behavior = { workspace = true, optional = true }
nodalia-docpath = { workspace = true }
nodalia-host = { workspace = true }
nodalia-i18n = { workspace = true }
nodalia-platform = { workspace = true }
nodalia-settings = { workspace = true }
nodalia-theme = { workspace = true }
nodalia-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }
tempfile = "3"
