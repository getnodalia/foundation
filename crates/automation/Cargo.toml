[package]
name = "nodalia-automation"
description = "Drive a running Craft app from tests, agents and the CLI (control channel, screenshot queue, frame profiler and frame trace; native only), and recorded actions with the Actions panel (every target)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The egui parts: the Actions panel, the control channel's server side (screenshots, synthetic
# input) and `ui` stories. Without it the crate has no egui: `ControlOptions`, `ControlClient`,
# `Params` and the recorded actions' model and files.
ui = ["dep:nodalia-behavior", "dep:nodalia-keymap", "dep:nodalia-ui", "dep:egui"]
# The Actions panel's and the Agents page's stories and mock, and the integration binary `tests/it`.
screen-testing = ["ui", "agents", "nodalia-ui/testing"]
# Agents in the open window (desktop): the ArtCraft Launcher's switch, the connection file an
# app's `<id>-cli mcp` reads, and with `ui` the link host and the Agents page. The agent settings
# build on every target without it.
agents = ["dep:nodalia-ai-agents", "dep:nodalia-flags", "dep:nodalia-atomic", "dep:nodalia-host"]

[dependencies]
nodalia-behavior = { workspace = true, optional = true }
nodalia-keymap = { workspace = true, optional = true }
nodalia-theme = { workspace = true }
nodalia-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The control channel, its server and client, screenshots, the profiler and the trace.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
nodalia-platform = { workspace = true }
nodalia-ai-agents = { workspace = true, optional = true }
nodalia-atomic = { workspace = true, optional = true }
nodalia-flags = { workspace = true, optional = true }
nodalia-host = { workspace = true, optional = true }
getrandom = "0.3"
hmac = "0.12"
log = "0.4"
png = "0.17"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }
