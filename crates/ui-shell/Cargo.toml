[package]
name = "nodalia-ui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The app shell and title bar of the craft UI library, and its eframe entry point"

[lib]
# Every test lives in the `it` integration binary.
test = false

[lints]
workspace = true

[features]
default = []
# `shell::app`: the eframe entry point.
app = ["dep:eframe", "nodalia-window/ui"]
# `nodalia_ui::testing`.
testing = ["nodalia-ui-panels/testing"]

[dependencies]
nodalia-ui-panels = { workspace = true }
nodalia-behavior = { workspace = true }
# `open::CAN_REVEAL`: whether the start screen offers Show in Folder.
nodalia-platform = { workspace = true }
nodalia-theme = { workspace = true }
nodalia-ui-macros = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "default_fonts"], optional = true }
nodalia-host = { workspace = true }
nodalia-window = { workspace = true }
nodalia-i18n = { workspace = true, features = ["collate"] }
# The saved forms of `ScreenMode`, `RecentView` and `RecentSort`.
serde = { workspace = true }
# The caption button icons.
nodalia-svg = { workspace = true, features = ["draw"] }
# `std::time::Instant` on native; the browser clock on wasm, where `Instant::now` panics.
web-time = "1.1"

# `AppSpec::new` installs `nodalia_window::system::SystemWindows`, which reads AppKit without nodalia-window's egui layer.
[target.'cfg(target_os = "macos")'.dependencies]
nodalia-window = { workspace = true, features = ["appkit"] }

[dev-dependencies]
nodalia-ui-shell = { path = ".", features = ["testing"] }
nodalia-behavior = { workspace = true }
nodalia-host = { workspace = true }
nodalia-theme = { workspace = true }
nodalia-ui-test-kit = { workspace = true }
nodalia-window = { workspace = true }
egui = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
