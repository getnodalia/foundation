[package]
name = "nodalia-theme-editor"
description = "The theme editor's panels: the token browser, token detail, problems list and app size overrides over an explained theme."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target runs the stories registered by the crate.
harness = false

[features]
default = []
# The panels' stories.
screen-testing = ["nodalia-ui/testing"]

[dependencies]
nodalia-behavior = { workspace = true }
nodalia-theme = { workspace = true }
nodalia-ui = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }

[lints]
workspace = true
