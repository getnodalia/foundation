[package]
name = "nodalia-xlsx"
description = "Excel workbooks (.xlsx, .xlsm, SpreadsheetML in an OPC package) and binary workbooks (.xlsb): the workbook part, shared strings, the styles tables and a worksheet's rows and cells as a stream, with every other part reachable for the caller."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `testing`: writers of small workbooks and packages, for the tests of crates that read them.
test-support = []

[dependencies]
nodalia-drawingml = { workspace = true }
nodalia-opc = { workspace = true }
nodalia-sheet = { workspace = true }
nodalia-xml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nodalia-xlsx = { path = ".", features = ["test-support"] }
