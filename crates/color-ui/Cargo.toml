[package]
name = "nodalia-color-ui"
description = "Colour for Craft apps: the colour picker, wells, swatch tables, ramps and the hex field."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The colour widgets (`nodalia_color_ui::ui`).
ui = ["dep:nodalia-behavior", "dep:nodalia-keymap", "dep:nodalia-ui", "dep:egui", "dep:nodalia-settings", "dep:nodalia-window", "nodalia-platform/screen", "dep:serde_json"]
# Screenshot and input tests of the widgets with egui_kittest (desktop only).
screen-testing = ["ui", "nodalia-ui/testing"]

[dependencies]
nodalia-behavior = { workspace = true, optional = true }
nodalia-cms = { workspace = true }
nodalia-host = { workspace = true }
nodalia-i18n = { workspace = true }
nodalia-keymap = { workspace = true, optional = true }
nodalia-platform = { workspace = true }
nodalia-settings = { workspace = true, optional = true }
nodalia-theme = { workspace = true }
nodalia-ui = { workspace = true, optional = true }
nodalia-window = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
