[package]
name = "nodalia-ui-panels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sections, dialogs, docking and rails of the craft UI library"

[lib]
# Every test lives in the `it` integration binary.
test = false

[lints]
workspace = true

[features]
default = []
# `nodalia_ui::testing` with `testing::internals`.
testing = ["nodalia-ui-widgets/testing"]

[dependencies]
nodalia-ui-widgets = { workspace = true }
nodalia-behavior = { workspace = true }
nodalia-keymap = { workspace = true, features = ["egui"] }
nodalia-theme = { workspace = true }
nodalia-ui-macros = { workspace = true }
egui = { workspace = true }
nodalia-host = { workspace = true }
# `dialog::UnsavedChangesDialog` answers a `nodalia_quit` close.
nodalia-quit = { workspace = true }
nodalia-i18n = { workspace = true, features = ["collate"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nodalia-ui-panels = { path = ".", features = ["testing"] }
nodalia-behavior = { workspace = true }
nodalia-keymap = { workspace = true, features = ["egui"] }
egui = { workspace = true }
serde = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
