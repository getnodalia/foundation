[package]
name = "nodalia-ui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Story viewer over nodalia-ui's registered stories"
publish = false
autotests = false
default-run = "nodalia-ui-gallery"

[lib]
path = "src/lib.rs"
# Every test lives in the `it` integration binary.
test = false

[[bin]]
name = "nodalia-ui-gallery"
path = "src/main.rs"
test = false

[[bin]]
name = "components-index"
path = "src/bin/components-index.rs"
test = false

[[bin]]
name = "contract-api"
path = "src/bin/contract-api.rs"
test = false

[features]
# One feature per domain crate whose stories the viewer links; `apps` is all of them and the default. A build
# that needs one crate's stories only (the story renderer) turns the default off and names the crate.
default = ["apps"]
apps = ["automation", "browse", "color-ui", "draw", "imaging", "layers", "menu", "pages", "print", "review", "table", "text", "theme-store", "timeline", "dialogs", "font-manager", "update"]
automation = ["dep:nodalia-automation"]
browse = ["dep:nodalia-browse"]
color-ui = ["dep:nodalia-color-ui"]
draw = ["dep:nodalia-draw"]
imaging = ["dep:nodalia-imaging"]
layers = ["dep:nodalia-layers"]
menu = ["dep:nodalia-menu"]
pages = ["dep:nodalia-pages"]
print = ["dep:nodalia-print"]
review = ["dep:nodalia-review"]
table = ["dep:nodalia-table"]
text = ["dep:nodalia-text"]
theme-store = ["dep:nodalia-theme-store"]
timeline = ["dep:nodalia-timeline"]
dialogs = ["dep:nodalia-dialogs"]
font-manager = ["dep:nodalia-font-manager"]
update = ["dep:nodalia-update"]

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false

[lints]
workspace = true

[dependencies]
nodalia-ui = { workspace = true, features = ["app", "testing"] }
nodalia-i18n = { workspace = true }
nodalia-theme = { workspace = true }
nodalia-window = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# The viewer's saved settings and its panel layout.
nodalia-behavior = { workspace = true }
nodalia-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = "1.1"

# The domain crates' stories, registered under each crate's `screen-testing`.
nodalia-automation = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-browse = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-color-ui = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-draw = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-imaging = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-layers = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-menu = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-pages = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-print = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-review = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-table = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-text = { workspace = true, features = ["screen-testing", "find"], optional = true }
nodalia-theme-store = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-timeline = { workspace = true, features = ["screen-testing"], optional = true }

# Native only: these crates do not build for the web, so their stories are not in the web gallery.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nodalia-dialogs = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-font-manager = { workspace = true, features = ["screen-testing"], optional = true }
nodalia-update = { workspace = true, features = ["screen-testing"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
