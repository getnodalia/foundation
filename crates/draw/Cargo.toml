[package]
name = "nodalia-draw"
description = "Vector and shape tools for Craft apps: gradient editing, pen, stroke, shapes, crop, free transform, measure, symmetry and brush presets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The tool widgets (`nodalia_draw::ui`).
ui = ["dep:nodalia-behavior", "dep:nodalia-keymap", "dep:nodalia-ui", "dep:egui", "dep:nodalia-color-ui", "nodalia-color-ui/ui", "dep:nodalia-settings", "dep:serde_json"]
# The widgets' stories and trials (`tests/it`).
screen-testing = ["ui", "nodalia-ui/testing", "nodalia-color-ui/screen-testing"]

[dependencies]
nodalia-behavior = { workspace = true, optional = true }
nodalia-color-ui = { workspace = true, optional = true }
nodalia-host = { workspace = true }
nodalia-i18n = { workspace = true }
nodalia-keymap = { workspace = true, optional = true }
nodalia-settings = { workspace = true, optional = true }
nodalia-theme = { workspace = true }
nodalia-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }
