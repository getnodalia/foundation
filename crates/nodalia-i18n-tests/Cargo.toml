[package]
name = "nodalia-i18n-tests"
description = "Checks on the translation catalogs themselves: rows are well formed, placeholders and plural forms match the English source text, locale and file names follow the layout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The runtime crate, at nodalia-libs main after #210: the checker takes each locale's plural form
# count from it (locale::plural_forms), so the two can't disagree.
nodalia-i18n = { git = "https://github.com/getnodalia/foundation", rev = "aaa6c885a662401969c5ac587d0fc4647e1d09ff" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spdx = "0.13.6"
tar = "0.4.46"
toml = "1.1.8"
unic-langid = "0.9"
ureq = "3.5.0"
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
# nodalia-libs main at the merge of #497 (flag-based compounding), which also has #496.
craft-proof = { git = "https://github.com/getnodalia/foundation", rev = "1a4b4a5d841c9d0e95467bd061100abca51a129a" }
