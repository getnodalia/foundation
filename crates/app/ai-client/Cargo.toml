[package]
name = "nodalia-ai-client"
description = "App-facing entry point of the Craft AI layer: resolve a role, check consent, fetch the key, start a job. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[features]
# Built-in engines. Off by default so an app that does not run models itself stays light. Turning
# one on is the whole of adopting it: `ProviderFactory::standard()` then knows the engine.
candle = ["dep:nodalia-ai-engine-candle"]
rten = ["dep:nodalia-ai-engine-rten"]
burn = ["dep:nodalia-ai-engine-burn"]

[dependencies]
nodalia-ai-core.workspace = true
nodalia-ai-native = { path = "../../foundation/ai-native", package = "nodalia-ai-native" }
nodalia-ai-openai = { path = "../../api/ai-openai", package = "nodalia-ai-openai" }
nodalia-ai-artcraft = { path = "../../api/ai-artcraft", package = "nodalia-ai-artcraft" }
nodalia-ai-bfl = { path = "../../api/ai-bfl", package = "nodalia-ai-bfl" }
nodalia-ai-gemini = { path = "../../api/ai-gemini", package = "nodalia-ai-gemini" }
nodalia-ai-features = { path = "../../foundation/ai-features", package = "nodalia-ai-features" }
nodalia-ai-media = { path = "../../foundation/ai-media", package = "nodalia-ai-media" }
nodalia-ai-comfyui = { path = "../../local/ai-comfyui", package = "nodalia-ai-comfyui" }
nodalia-ai-comfy-env = { path = "../../local/ai-comfy-env", package = "nodalia-ai-comfy-env" }
nodalia-ai-seedance = { path = "../../api/ai-seedance", package = "nodalia-ai-seedance" }
nodalia-ai-vertex = { path = "../../api/ai-vertex", package = "nodalia-ai-vertex" }
nodalia-ai-sam3 = { path = "../../local/ai-sam3", package = "nodalia-ai-sam3" }
nodalia-ai-declarative = { path = "../../api/ai-declarative", package = "nodalia-ai-declarative" }
nodalia-ai-engine = { path = "../../local/ai-engine", package = "nodalia-ai-engine" }
nodalia-ai-engine-candle = { path = "../../local/ai-engine-candle", package = "nodalia-ai-engine-candle", optional = true }
# The picker-preset "Released …" date goes through chrono (no hand-rolled calendar code).
chrono = { workspace = true }
nodalia-ai-engine-rten = { path = "../../local/ai-engine-rten", package = "nodalia-ai-engine-rten", optional = true }
nodalia-ai-engine-burn = { path = "../../local/ai-engine-burn", package = "nodalia-ai-engine-burn", optional = true }
# Reads `file:` addresses to measure what the consent prompt shows.
url = "2"
# Run records (`run_record.rs`): JSON lines with a SHA-256 of each result. sha2 0.11 is already
# in the tree through nodalia-ai-comfy-env.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
# The live example checks existing output aliases, including Windows hardlinks, without unsafe.
# same-file 1.0.6 is already locked through walkdir; use its provided MIT licence.
same-file = "=1.0.6"
serde_json.workspace = true
tempfile = "3"
png = "0.18"

[lints]
workspace = true
