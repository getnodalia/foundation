[package]
name = "nodalia-review"
description = "Review for Craft apps: comments and threads, annotations, signatures, version history and revisions; presence, voting, chat and join over the app's own transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The review widgets (`nodalia_review::ui`).
ui = ["dep:nodalia-keymap", "dep:nodalia-ui", "dep:nodalia-host", "dep:nodalia-theme", "dep:egui", "dep:image"]
# The stories and the integration tests (`tests/it`).
screen-testing = ["ui", "nodalia-ui/testing"]

[dependencies]
nodalia-behavior = { workspace = true }
nodalia-host = { workspace = true, optional = true, features = ["ui"] }
nodalia-i18n = { workspace = true }
nodalia-keymap = { workspace = true, optional = true }
nodalia-theme = { workspace = true, optional = true }
nodalia-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
kurbo = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }
serde_json = { workspace = true }
