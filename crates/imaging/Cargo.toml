[package]
name = "nodalia-imaging"
description = "Raster image editing for Craft apps: warps, adjustments, layer styles, selection tools and masks, the full-window editors, the Channels panel and the scopes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The editing widgets (`nodalia_imaging::ui`).
ui = ["nodalia-color-ui/ui", "dep:serde_json", "dep:nodalia-behavior", "dep:nodalia-keymap", "dep:nodalia-ui", "dep:egui", "dep:kurbo"]
# Stories and integration trials of the widgets.
screen-testing = ["ui", "nodalia-ui/testing"]

[dependencies]
nodalia-behavior = { workspace = true, optional = true }
nodalia-color-ui = { workspace = true }
nodalia-host = { workspace = true }
nodalia-i18n = { workspace = true }
nodalia-keymap = { workspace = true, optional = true }
nodalia-theme = { workspace = true }
nodalia-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
