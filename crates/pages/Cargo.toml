[package]
name = "nodalia-pages"
description = "Pages for the Craft document apps: page geometry, page setup, page ranges and numbering; with `ui`, the page view, thumbnails, page setup dialog, rulers' margin handles, header and footer zones and document tables."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
# The lib's test target is the crate's one test executable: its trials and, with `screen-testing`, the
# screen tests in tests/it.
harness = false

[lints]
workspace = true

[features]
default = []
# The page widgets (`nodalia_pages::ui`), on nodalia-ui.
ui = ["dep:nodalia-behavior", "dep:nodalia-ui", "dep:nodalia-theme", "dep:egui"]
# The stories and the integration tests (`tests/it`).
screen-testing = ["ui", "nodalia-ui/testing"]

[dependencies]
# `numbering` formats page numbers with nodalia-text's list number styles.
nodalia-text = { path = "../text", default-features = false }
kurbo = { workspace = true }
serde = { workspace = true }
nodalia-behavior = { workspace = true, optional = true }
nodalia-ui = { workspace = true, optional = true }
nodalia-theme = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
nodalia-ui = { workspace = true, features = ["testing"] }
egui = { workspace = true }
nodalia-i18n = { workspace = true }
