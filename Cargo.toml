[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/krilla", "vendor/hayro", "vendor/hayro-interpret", "vendor/hayro-syntax", "vendor/hayro-jbig2", "vendor/hayro-cmap", "vendor/hayro-postscript", "vendor/linesweeper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/getnodalia/foundation"

[workspace.dependencies]
acadrust = "=0.6.6"
log = "0.4"
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
nodalia-platform = { path = "crates/platform" }
nodalia-aep = { path = "crates/aep" }
nodalia-affinity = { path = "crates/affinity" }
nodalia-ai-core = { path = "crates/ai-core" }
nodalia-pdf = { path = "crates/pdf", version = "=0.1.0" }
nodalia-pdn = { path = "crates/pdn" }
nodalia-plate-test = { path = "crates/plate-test" }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
hayro = { version = "=0.7.1", default-features = false }
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
bytemuck = "1"
kurbo = "0.13"
thiserror = "2"
nodalia-aaf = { path = "crates/aaf" }
nodalia-atomic = { path = "crates/atomic" }
nodalia-captions = { path = "crates/captions" }
nodalia-cfb = { path = "crates/cfb" }
