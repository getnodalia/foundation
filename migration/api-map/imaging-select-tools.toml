# API map of the "Imaging selection tools" family: old path to new path and setter renames.

family = "Imaging selection tools"
new_module = "nodalia_imaging::ui::select"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "MarqueeTool"
old = "nodalia_imaging::ui::select::MarqueeTool"
new = "nodalia_imaging::ui::select::MarqueeTool"
status = "same"

[[type]]
name = "MarqueeKind"
old = "nodalia_imaging::ui::select::MarqueeKind"
new = "nodalia_imaging::ui::select::MarqueeKind"
status = "same"

[[type]]
name = "LassoTool"
old = "nodalia_imaging::ui::select::LassoTool"
new = "nodalia_imaging::ui::select::LassoTool"
status = "same"

[[type]]
name = "PolygonLassoTool"
old = "nodalia_imaging::ui::select::PolygonLassoTool"
new = "nodalia_imaging::ui::select::PolygonLassoTool"
status = "same"

[[type]]
name = "MagneticLassoTool"
old = "nodalia_imaging::ui::select::MagneticLassoTool"
new = "nodalia_imaging::ui::select::MagneticLassoTool"
status = "same"

[[type]]
name = "MagneticSettings"
old = "nodalia_imaging::ui::select::MagneticSettings"
new = "nodalia_imaging::ui::select::MagneticSettings"
status = "same"

[[type]]
name = "EdgeTracer"
old = "nodalia_imaging::ui::select::EdgeTracer"
new = "nodalia_imaging::ui::select::EdgeTracer"
status = "same"

[[type]]
name = "EdgeSearch"
old = "nodalia_imaging::ui::select::EdgeSearch"
new = "nodalia_imaging::ui::select::EdgeSearch"
status = "same"

[[type]]
name = "SelectEvent"
old = "nodalia_imaging::ui::select::SelectEvent"
new = "nodalia_imaging::ui::select::SelectEvent"
status = "same"

[[type]]
name = "SelectPhase"
old = "nodalia_imaging::ui::select::SelectPhase"
new = "nodalia_imaging::ui::select::SelectPhase"
status = "same"

[[type]]
name = "SelectionShape"
old = "nodalia_imaging::ui::select::SelectionShape"
new = "nodalia_imaging::ui::select::SelectionShape"
status = "same"

[[type]]
name = "SelectionDrag"
old = "nodalia_imaging::ui::select::SelectionDrag"
new = "nodalia_imaging::ui::select::SelectionDrag"
status = "same"

[[type]]
name = "DragKind"
old = "nodalia_imaging::ui::select::DragKind"
new = "nodalia_imaging::ui::select::DragKind"
status = "same"

[[type]]
name = "SelectionProbe"
old = "nodalia_imaging::ui::select::SelectionProbe"
new = "nodalia_imaging::ui::select::SelectionProbe"
status = "same"

[[type]]
name = "SelectToolPass"
old = "nodalia_imaging::ui::select::SelectToolPass"
new = "nodalia_imaging::ui::select::SelectToolPass"
status = "same"

[[type]]
name = "InsideDrag"
old = "nodalia_imaging::ui::select::InsideDrag"
new = "nodalia_imaging::ui::select::InsideDrag"
status = "same"

[[type]]
name = "PressRule"
old = "nodalia_imaging::ui::select::PressRule"
new = "nodalia_imaging::ui::select::PressRule"
status = "same"

[[type]]
name = "SelectLabels"
old = "nodalia_imaging::ui::select::SelectLabels"
new = ""
status = "replaced"
note = "SelectWords: the words come from the env (`ToolContext::words`); the tools take no labels setter."

[[type]]
name = "SelectToolStyle"
old = "nodalia_imaging::ui::select::SelectToolStyle"
new = ""
status = "removed"
note = "The tools paint from the theme's overlay colours and named sizes; there is no tool style."

# One entry per renamed, removed or reshaped setter or constructor.
[[setter]]
type = "MarqueeTool"
old = "labels(SelectLabels)"
new = ""
note = "Removed: the words come from the env."

[[setter]]
type = "LassoTool"
old = "labels(SelectLabels)"
new = ""
note = "Removed: the words come from the env."

[[setter]]
type = "PolygonLassoTool"
old = "labels(SelectLabels)"
new = ""
note = "Removed: the words come from the env."

[[setter]]
type = "MagneticLassoTool"
old = "labels(SelectLabels)"
new = ""
note = "Removed: the words come from the env."

[[setter]]
type = "SelectionProbe"
old = "size() -> [u32; 2]"
new = "size() -> nodalia_behavior::PixelSize"

[[setter]]
type = "InsideDrag"
old = "begin(&ConstrainStyle, DragKind, Point, Modifiers)"
new = "begin(&ConstrainStyle, DragKind, Point, Mods, GestureId, Arc<str>, Option<kurbo::Rect>)"
note = "The id and the undo step's name come from the caller; the Begin event carries the zero delta as its value before. The last argument is the selection's bounds at the press (SelectionProbe::bounds), which snap as the drag moves; None leaves the drag unsnapped. The point is the raw document point."

[[setter]]
type = "InsideDrag"
old = "drag(Point, Modifiers, f64)"
new = "drag(Point, Mods, f64, &mut dyn FnMut(kurbo::Rect) -> Vec2)"
note = "The raw document point; the closure is the tool's ToolContext::snap_rect, called with the press bounds moved by the drag before the delta rounds to whole pixels."

[[setter]]
type = "InsideDrag"
old = "end(Point, Modifiers, f64)"
new = "end(Point, Mods, f64, &mut dyn FnMut(kurbo::Rect) -> Vec2)"
note = "Snaps as drag does; the Commit carries the whole-pixel delta."

[[setter]]
type = "InsideDrag"
old = "cancel()"
new = "cancel(CancelReason)"

[[setter]]
type = "PressRule"
old = "drag_kind(.., Modifiers, ..)"
new = "drag_kind(.., Mods, ..)"
note = "Mods from nodalia_keymap; cursor_over returns nodalia_behavior::Cursor."

[[setter]]
type = "SelectEvent"
old = "DragSelection(EditEvent<SelectionDrag>) with Commit.changed"
new = "DragSelection(EditEvent<SelectionDrag>)"
note = "EditEvent::Commit has no changed flag: a delta of [0, 0] is no change."
