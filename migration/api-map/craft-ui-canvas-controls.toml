old = ""
new = "nodalia_ui::canvas_controls::GuidesOutput"
status = "replaced"
note = "Legacy `GuidesResponse`: `edit: EditResponse<Vec<Guide>>` replaces `event`; `select`, `clicked` (with `nodalia_keymap::Mods` and a document point), `double_clicked` and `context` carry over with `GuideKey`; `id`, `claimed` and `hovered` are gone because a press on a guide never reaches the tool."

[[type]]
