[[type]]
name = "BrushStyle"
old = "nodalia_ui::canvas::brush::BrushStyle"
new = ""
status = "removed"
note = "The cursor sizes, the preview tint and the resize travel are gone as one value: the painters read their colours from tokens in their ComponentStyle (FalloffPreviewStyle), the crosshair reach is the token size.hit.target, read by BrushCursor::cursor through ToolContext::reach, and the travel is BrushResizeOptions::travel (default RESIZE_TRAVEL)."

[[type]]
name = "BrushCursorOptions"
old = ""
new = "nodalia_ui::canvas_controls::brush::BrushCursorOptions"
status = "replaced"
note = "The user's cursor preferences a brush cursor reads (painting cursor, Show Only Crosshair While Painting, Caps Lock precise); replaces the brush part of the legacy CursorOptions."

[[type]]
name = "ResizeStep"
old = ""
new = "nodalia_ui::canvas_controls::brush::ResizeStep"
status = "replaced"
note = "A resize step { phase: GesturePhase, dimensions, changed }; replaces EditEvent<BrushDimensions>."

[[type]]
name = "FalloffPreview"
old = ""
new = "nodalia_ui::canvas_controls::brush::FalloffPreview"
status = "replaced"
note = "The canvas control that shows a TipFalloff and the brush circle; replaces TipFalloff::paint and BrushResize::paint."

[[type]]
name = "TipCell"
old = ""
new = "nodalia_ui::canvas_controls::brush::TipCell"
status = "replaced"
note = "The canvas control that shows an aliased tip's pixel cell; replaces BrushCursor::paint_pixels."

[[type]]
name = "CursorBitmap"
old = ""
new = "nodalia_ui::runtime::cursor::CursorBitmap"
status = "replaced"
note = "The OS cursor image of a painted pointer: the cursor service rasterises the pointer's art and hands it to the root window where the window takes an image at its scale and size, and the pointer is painted otherwise. Request a Cursor::Painted; no app code builds the image. Replaces the private cursor/bitmap.rs of the legacy cursor host."

[[setter]]
type = "BrushTip"
old = "the struct literal BrushTip { diameter, outline }"
new = "BrushTip::new(diameter, outline)"

[[setter]]
type = "BrushTipOutline"
old = "the struct-like variants Round { .. }, Traced { .. } and Pixels { .. } as literals"
new = "BrushTipOutline::round(normal_radius, full_radius), traced(normal, full) and pixels(cell, round)"

[[setter]]
