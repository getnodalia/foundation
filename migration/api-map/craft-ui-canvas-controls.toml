old = ""
new = "nodalia_ui::canvas_controls::CanvasControlWords"
status = "replaced"
note = "The one word set of the canvas controls. Legacy `GuideNames`: the vertical and horizontal guide names and the X and Y readout labels (ids `guides.*`); the marquee shape names and bounds template (`marquee.*`); and the row labels of the brush resize readout, replacing BrushResizeLabels (ids `brushResize.diameter`, `hardness`, `opacity`, `density`)."

[[type]]
name = "Orientation"
old = "nodalia_ui::canvas::guides::Orientation"
new = ""
status = "removed"
note = "`Guide::along: nodalia_behavior::Axis` is the axis the guide runs along: a vertical guide is `Axis::Y`, a horizontal one `Axis::X`. `flipped`, `across` and `position` are `nodalia_behavior::geometry::{across_axis, motion_across, coordinate_across}`."

[[type]]
