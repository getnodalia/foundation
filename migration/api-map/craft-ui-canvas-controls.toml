# API map of the "nodalia-ui canvas controls" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "nodalia-ui canvas controls"
new_module = "nodalia_ui::canvas_controls"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Guides"
old = "nodalia_ui::canvas::guides::Guides"
new = "nodalia_ui::canvas_controls::Guides"
status = "moved"
note = "A canvas control: `Guides::new(label, Bind<Vec<Guide>>)` shown with `show_at(ui, body.rect)` in a `Canvas` body that has a view; the guides are parts in the canvas's arena, so there is no `claimed` or `hovered` flag."

[[type]]
name = "SelectionFrame"
old = "nodalia_ui::canvas::selection::frame::SelectionFrame"
new = "nodalia_ui::canvas_controls::SelectionFrame"
status = "pending"

[[type]]
name = "GripSet"
old = "nodalia_ui::canvas::selection::grips::GripSet"
new = "nodalia_ui::canvas_controls::GripSet"
status = "pending"

[[type]]
name = "Marquee"
old = "nodalia_ui::canvas::marquee::Marquee"
new = "nodalia_ui::canvas_controls::Marquee"
status = "moved"

